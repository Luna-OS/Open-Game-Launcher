# Flatpak-Manifest. Baut KEIN Rust, sondern packt die fertige Linux-Datei aus dem CI ein.
app-id: io.github.mikeadamrgb.MAZLauncher
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: maz-launcher
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Spiele finden (Steam, Heroic, eigene Spiele) – nur lesen
  - --filesystem=host:ro
  # Updates in den Download-Ordner legen
  - --filesystem=xdg-download
  # Spiele und Clients (Steam, Heroic, Sober …) auf dem Computer starten
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: maz-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 maz-launcher /app/bin/maz-launcher
      - install -Dm644 io.github.mikeadamrgb.MAZLauncher.desktop /app/share/applications/io.github.mikeadamrgb.MAZLauncher.desktop
      - install -Dm644 io.github.mikeadamrgb.MAZLauncher.metainfo.xml /app/share/metainfo/io.github.mikeadamrgb.MAZLauncher.metainfo.xml
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.mikeadamrgb.MAZLauncher.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.mikeadamrgb.MAZLauncher.png
    sources:
      - type: dir
        path: flatpak-src
