[package]
name = "maz-launcher"
version = "1.3.2"
edition = "2021"
rust-version = "1.85"
description = "MAZ Launcher – alle deine Steam-, Epic-, Roblox- und eigenen Spiele in einem schönen Launcher (Windows, macOS, Linux)"
license = "MIT"
repository = "https://github.com/MikeAdamRGB/MAZ-Lauchner"
readme = "README.md"
keywords = ["launcher", "games", "steam", "epic", "dioxus"]
categories = ["games", "gui"]
build = "build.rs"

[[bin]]
name = "MAZ-Launcher"
path = "src/main.rs"

[dependencies]
# UI: Dioxus (Grundlage von rust-ui) – nur die minimal nötigen Features
dioxus = { version = "0.7", default-features = false, features = ["desktop", "minimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
# Nur PNG/JPEG – hält die EXE klein
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# HTTP für optionale Online-Funktionen (Steam-API, Cover-Suche).
# native-tls nutzt das in Windows eingebaute SChannel → keine große TLS-Bibliothek in der EXE.
ureq = { version = "3.5", default-features = false, features = ["json", "native-tls-no-default"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17", default-features = false }

[build-dependencies]
winresource = "0.1"

# ------------------------------------------------------------------
# So klein wie möglich: auf Größe optimieren, alles Unnötige raus
# ------------------------------------------------------------------
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

# Abhängigkeiten im Debug-Build optimieren → schnelleres Entwickeln
[profile.dev.package."*"]
opt-level = 2
