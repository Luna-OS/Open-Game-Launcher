name: Build

# Baut bei jedem Push die Windows-EXE.
# Bei einem Tag wie "v1.0.0" wird automatisch ein GitHub-Release mit der EXE erstellt.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Server für Konto & Freunde (optional, siehe docs/SERVER-SETUP.md)
  MAZ_SUPABASE_URL: ${{ secrets.MAZ_SUPABASE_URL }}
  MAZ_SUPABASE_KEY: ${{ secrets.MAZ_SUPABASE_KEY }}

jobs:
  build:
    name: Windows-EXE bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Tailwind-CSS neu erzeugen
        shell: pwsh
        run: ./scripts/build-css.ps1

      - name: Release-Build
        shell: pwsh
        run: |
          cargo build --release --message-format=short 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Tests
        shell: pwsh
        run: |
          cargo test --release 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fehlerprotokoll in Branch "ci-log" speichern
        if: failure() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          New-Item -ItemType Directory -Force ../ci | Out-Null
          if (Test-Path build.log) { Copy-Item build.log ../ci/ }
          if (Test-Path test.log) { Copy-Item test.log ../ci/ }
          git worktree add --orphan -b ci-log ../cilog
          Copy-Item ../ci/* ../cilog/
          Set-Location ../cilog
          git add -A
          git commit -m "CI-Log ${{ github.sha }}"
          git push -f origin ci-log

      - name: EXE einsammeln (+ Mini-Version mit UPX)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/MAZ-Launcher.exe dist/MAZ-Launcher.exe
          choco install upx -y --no-progress
          upx --best --lzma -o dist/MAZ-Launcher-mini.exe target/release/MAZ-Launcher.exe
          Get-ChildItem dist | ForEach-Object { "{0,-28} {1,8:N2} MB" -f $_.Name, ($_.Length / 1MB) }
          Copy-Item Cargo.lock dist/Cargo.lock

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MAZ-Launcher
          path: dist/

      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: GitHub-Release erstellen / aktualisieren
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MAZ Launcher ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/MAZ-Launcher.exe
            dist/MAZ-Launcher-mini.exe
