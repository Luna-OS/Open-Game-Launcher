# Lädt freie Spiele-Screenshots (Wikimedia Commons) für die Webseite in den Branch "site-images".
# Die Bilder werden danach von Hand ausgewählt und unter site/img/games/ eingecheckt.
name: Spiele-Bilder für die Webseite

on:
  workflow_dispatch:
  push:
    branches: ["ci/images"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Bilder laden
        run: python3 scripts/fetch-game-images.py out
      - name: In Branch site-images speichern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b site-images
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Spiele-Bilder $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-images
